<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锻炼打卡 | Raymond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  main { max-width: 980px; margin: 0 auto; padding: 3.5rem 1.5rem 0; }

  .hero h1 { font-family: var(--serif-zh); font-weight: 900; font-size: clamp(2.6rem, 7vw, 4.6rem); line-height: 1.1; }
  .hero .scribble { font-family: var(--hand); font-size: 1.6rem; color: var(--coral); transform: rotate(-2deg); display: inline-block; margin-top: .3rem; }

  .stats { display: flex; flex-wrap: wrap; gap: 2.2rem; margin: 2rem 0 2.4rem; }
  .stat strong { font-family: var(--serif); font-size: 2rem; display: block; line-height: 1; }
  .stat span { color: var(--muted); font-size: .9rem; }
  .stat.streak strong { color: var(--coral); }

  /* ===== calendar: the stamp card ===== */
  .card {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 16px;
    padding: 1.4rem 1.4rem 1.2rem; box-shadow: 8px 8px 0 var(--mint);
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .cal-head h2 { font-family: var(--hand); font-size: 2rem; color: var(--indigo); line-height: 1; }
  .cal-nav { display: flex; gap: .5rem; }
  .cal-nav button {
    font: inherit; font-size: 1.2rem; width: 2.4rem; height: 2.4rem; cursor: pointer;
    border: 2px solid var(--ink); border-radius: 50%; background: var(--cream);
  }
  .cal-nav button:disabled { opacity: .3; cursor: default; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal .wd { text-align: center; font-size: .8rem; color: var(--muted); padding-bottom: .2rem; }
  .day {
    position: relative; aspect-ratio: 1; border-radius: 10px; border: 2px dashed rgba(26,26,46,.18);
    font-size: .85rem; color: var(--muted); padding: .25rem .4rem; overflow: hidden;
    background: transparent; font-family: inherit; text-align: left;
  }
  .day.blank { border: none; }
  .day.future { opacity: .45; }
  .day.today { border: 2px solid var(--ink); color: var(--ink); font-weight: 700; }
  button.day { cursor: pointer; }
  .day.done { border: 2px solid var(--ink); color: var(--ink); background: var(--cream); }
  .day .stamp {
    position: absolute; right: 9%; bottom: 8%; width: 62%; aspect-ratio: 1; border-radius: 50%;
    background: var(--c); border: 2px solid var(--ink); display: grid; place-items: center;
    font-family: var(--hand); font-weight: 700; font-size: clamp(1.1rem, 3.4vw, 2rem); color: var(--ink);
    transform: rotate(var(--rot, -8deg));
  }
  .day .num { position: absolute; top: .25rem; left: .4rem; z-index: 1; line-height: 1.4; }
  .day.photo { background-size: cover; background-position: center; color: #fff; }
  .day.photo .num { background: rgba(26,26,46,.7); border-radius: 6px; padding: 0 .35rem; }
  .day.photo .tick {
    position: absolute; right: 4px; bottom: 4px; width: 1.5rem; height: 1.5rem; border-radius: 50%;
    background: var(--c); border: 2px solid var(--ink); display: grid; place-items: center;
    font-family: var(--hand); font-weight: 700; color: var(--ink); font-size: 1rem;
  }
  .day .count { position: absolute; top: 3px; right: 5px; font-size: .7rem; font-weight: 700; color: var(--ink); }
  .day.photo .count { color: #fff; }
  button.day:hover { transform: translateY(-2px); }
  .legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; margin-top: 1rem; font-size: .85rem; color: var(--muted); }
  .legend i { display: inline-block; width: .8rem; height: .8rem; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--c); margin-right: .35rem; vertical-align: -1px; }

  /* ===== feed ===== */
  .feed { margin-top: 3.4rem; }
  .feed > h2 { font-family: var(--serif-zh); font-size: 1.8rem; margin-bottom: .6rem; }
  .log { display: grid; grid-template-columns: 72px 1fr; gap: 1.2rem; padding: 1.2rem 0; border-top: 2px dashed rgba(26,26,46,.2); scroll-margin-top: 110px; border-radius: 8px; transition: background .4s; }
  .log.flash { background: rgba(244,162,54,.18); }
  .log-date { text-align: center; }
  .log-date b { font-family: var(--serif); font-size: 2rem; line-height: 1; display: block; }
  .log-date small { color: var(--muted); font-size: .8rem; }
  .log-meta { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem; }
  .type { display: inline-flex; align-items: center; gap: .35rem; padding: .1rem .7rem .1rem .3rem; border: 2px solid var(--ink); border-radius: 999px; font-weight: 500; font-size: .9rem; background: var(--paper); }
  .type::before { content: '✓'; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--c); border: 1.5px solid var(--ink); display: grid; place-items: center; font-family: var(--hand); font-weight: 700; font-size: .95rem; }
  .num-chip { color: var(--muted); font-size: .95rem; }
  .log p { margin-top: .5rem; max-width: 60ch; white-space: pre-line; }
  .log p.en { color: var(--muted); font-size: .95rem; padding-left: .9rem; border-left: 3px solid var(--c); }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; margin-top: .8rem; max-width: 640px; }
  .photos button { border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; padding: 0; cursor: zoom-in; aspect-ratio: 4 / 3; background: var(--cream); }
  .photos img { width: 100%; height: 100%; object-fit: cover; transition: transform .25s; }
  .photos button:hover img { transform: scale(1.05); }
  .month-label { font-family: var(--hand); font-size: 1.7rem; color: var(--indigo); margin: 2rem 0 .3rem; }
  .month-label + .log { border-top: none; }

  /* ===== lightbox ===== */
  dialog.lightbox { border: none; padding: 0; background: transparent; max-width: 94vw; max-height: 92vh; margin: auto; }
  dialog.lightbox::backdrop { background: rgba(26,26,46,.88); }
  .lb-inner { display: flex; flex-direction: column; align-items: center; gap: .8rem; }
  .lb-inner img { max-width: 94vw; max-height: 78vh; border: 3px solid var(--cream); border-radius: 8px; }
  .lb-bar { display: flex; align-items: center; gap: 1rem; color: var(--cream); }
  .lb-bar button { font: inherit; font-size: 1.1rem; cursor: pointer; width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 2px solid var(--cream); background: transparent; color: var(--cream); }
  .lb-bar .cap { min-width: 10rem; text-align: center; font-size: .95rem; }

  @media (max-width: 640px) {
    .card { padding: 1rem .8rem; box-shadow: 5px 5px 0 var(--mint); }
    .cal { gap: 4px; }
    .day { border-radius: 7px; font-size: .72rem; padding: .1rem .25rem; }
    .day .stamp { width: 50%; right: 6%; bottom: 6%; font-size: .95rem; border-width: 1.5px; }
    .day.photo .tick { width: 1.1rem; height: 1.1rem; font-size: .75rem; }
    .log { grid-template-columns: 52px 1fr; gap: .9rem; }
    .log-date b { font-size: 1.6rem; }
    .photos { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<nav class="site-nav" aria-label="Main">
  <a class="nav-logo" href="index.html">Raymond</a>
  <ul class="nav-links">
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#research">Research</a></li>
    <li><a href="index.html#publications">Publications</a></li>
    <li><a href="index.html#cv">CV</a></li>
    <li><a href="index.html#notebook">Notebook</a></li>
    <li><a href="reading.html">读书笔记</a></li>
    <li><a href="workout.html" aria-current="page">锻炼打卡</a></li>
  </ul>
</nav>

<main>
  <section class="hero">
    <h1>锻炼打卡</h1>
    <div class="scribble">动起来就算数</div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="card" aria-label="打卡日历">
    <div class="cal-head">
      <h2 id="cal-title"></h2>
      <div class="cal-nav">
        <button id="prev" aria-label="上个月">‹</button>
        <button id="next" aria-label="下个月">›</button>
      </div>
    </div>
    <div class="cal" id="cal"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="feed">
    <h2>打卡记录</h2>
    <div id="feed"></div>
  </section>
</main>

<dialog class="lightbox" id="lb" aria-label="照片">
  <div class="lb-inner">
    <img id="lb-img" alt="">
    <div class="lb-bar">
      <button id="lb-prev" aria-label="上一张">‹</button>
      <span class="cap" id="lb-cap"></span>
      <button id="lb-next" aria-label="下一张">›</button>
      <button id="lb-close" aria-label="关闭">✕</button>
    </div>
  </div>
</dialog>

<footer class="site-footer">
  <div class="wrap">
    <span class="sign">a little movement every day</span>
    <div class="links">
      <a href="index.html">主页</a>
      <a href="reading.html">读书笔记</a>
    </div>
  </div>
</footer>

<script src="assets/notes.js"></script>
<script>
const LOG_FILE = 'workout/log.json';
const PHOTO_DIR = 'workout/photos/';
// Colors for common workout types. Any other type gets a color automatically.
const TYPE_COLORS = { '跑步': '#E8645A', '骑车': '#6DAEDB', '散步': '#5ABFA1', '健身': '#F4A236', '游泳': '#B8A9C9', '瑜伽': '#F2C4CE' };
const typeName = e => e.type || '打卡';
const typeColor = e => TYPE_COLORS[e.type] || (e.type ? bookColor(e.type) : '#E9C46A');

let log = [], byDay = {}, allPhotos = [];
let view; // Date set to the 1st of the month being shown

/* ---------- load ---------- */
(async () => {
  try {
    const res = await fetch(LOG_FILE, { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    log = (await res.json()).filter(e => e && e.date).sort((a, b) => b.date.localeCompare(a.date));
  } catch {
    document.querySelector('main').insertAdjacentHTML('afterbegin',
      `<div class="empty-state" style="margin-bottom:2rem">没能读取 <code>${LOG_FILE}</code>。请检查文件里的逗号和引号（必须是英文半角）。<br>${LOCAL_FILE_HINT}/workout.html</div>`);
    return;
  }
  log.forEach((e, i) => { e._id = `log-${i}`; (byDay[e.date] ||= []).push(e); });
  log.forEach(e => (e.photos || []).forEach(p => allPhotos.push({ src: PHOTO_DIR + p, entry: e })));

  const t = new Date();
  view = new Date(t.getFullYear(), t.getMonth(), 1);
  renderStats();
  renderCalendar();
  renderLegend();
  renderFeed();
})();

/* ---------- stats ---------- */
function renderStats() {
  const t = new Date();
  const monthKey = ymd(t).slice(0, 7);
  const thisMonth = log.filter(e => e.date.startsWith(monthKey));
  const days = new Set(thisMonth.map(e => e.date)).size;
  const km = thisMonth.reduce((s, e) => s + (Number(e.km) || 0), 0);
  const mins = thisMonth.reduce((s, e) => s + (Number(e.minutes) || 0), 0);
  document.getElementById('stats').innerHTML = `
    <div class="stat"><strong>${days}</strong><span>本月运动天数</span></div>
    <div class="stat streak"><strong>${dayStreak(log)}</strong><span>天连续打卡</span></div>
    ${km ? `<div class="stat"><strong>${+km.toFixed(1)}</strong><span>本月公里数</span></div>` : ''}
    ${mins ? `<div class="stat"><strong>${Math.round(mins / 6) / 10}</strong><span>本月小时数</span></div>` : ''}
    <div class="stat"><strong>${new Set(log.map(e => e.date)).size}</strong><span>累计打卡天数</span></div>`;
}

/* ---------- calendar ---------- */
function renderCalendar() {
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById('cal-title').textContent = `${y} 年 ${m + 1} 月`;
  const todayKey = ymd(new Date());
  const firstWeekday = (new Date(y, m, 1).getDay() + 6) % 7; // Monday first
  const daysInMonth = new Date(y, m + 1, 0).getDate();

  let html = ['一', '二', '三', '四', '五', '六', '日'].map(d => `<div class="wd">${d}</div>`).join('');
  for (let i = 0; i < firstWeekday; i++) html += `<div class="day blank"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const key = ymd(new Date(y, m, d));
    const entries = byDay[key];
    const cls = ['day'];
    if (key === todayKey) cls.push('today');
    if (key > todayKey) cls.push('future');
    if (!entries) { html += `<div class="${cls.join(' ')}"><span class="num">${d}</span></div>`; continue; }

    const withPhoto = entries.find(e => e.photos?.length);
    const main = withPhoto || entries[0];
    const label = `${m + 1} 月 ${d} 日：` + entries.map(typeName).join('、');
    const count = entries.length > 1 ? `<span class="count">×${entries.length}</span>` : '';
    cls.push('done');
    if (withPhoto) {
      cls.push('photo');
      html += `<button class="${cls.join(' ')}" data-day="${key}" aria-label="${esc(label)}"
        style="--c:${typeColor(main)};background-image:url('${esc(PHOTO_DIR + withPhoto.photos[0])}')">
        <span class="num">${d}</span>${count}<span class="tick">✓</span></button>`;
    } else {
      html += `<button class="${cls.join(' ')}" data-day="${key}" aria-label="${esc(label)}"
        style="--c:${typeColor(main)};--rot:${(strHash(key) % 24) - 12}deg">
        <span class="num">${d}</span>${count}<span class="stamp">✓</span></button>`;
    }
  }
  const cal = document.getElementById('cal');
  cal.innerHTML = html;
  cal.querySelectorAll('button.day').forEach(b => b.addEventListener('click', () => jumpTo(b.dataset.day)));

  // don't page past the current month or before the first record
  const now = new Date();
  document.getElementById('next').disabled = y === now.getFullYear() && m === now.getMonth();
  const oldest = log.length ? parseDate(log[log.length - 1].date) : now;
  document.getElementById('prev').disabled = y === oldest.getFullYear() && m === oldest.getMonth();
}
document.getElementById('prev').onclick = () => { view.setMonth(view.getMonth() - 1); renderCalendar(); };
document.getElementById('next').onclick = () => { view.setMonth(view.getMonth() + 1); renderCalendar(); };

function renderLegend() {
  const types = [...new Map(log.map(e => [typeName(e), e])).values()];
  document.getElementById('legend').innerHTML =
    types.map(e => `<span><i style="--c:${typeColor(e)}"></i>${esc(typeName(e))}</span>`).join('');
}

function jumpTo(day) {
  const el = document.getElementById(byDay[day][0]._id);
  el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1400);
}

/* ---------- feed ---------- */
function renderFeed() {
  const feed = document.getElementById('feed');
  if (!log.length) { feed.innerHTML = `<div class="empty-state">还没有打卡记录。在 <code>workout/log.json</code> 里加一行 <code>{ "date": "${ymd(new Date())}" }</code> 就算今天打卡了。</div>`; return; }
  let html = '', month = '';
  for (const e of log) {
    const d = parseDate(e.date);
    const mLabel = `${d.getFullYear()} 年 ${d.getMonth() + 1} 月`;
    if (mLabel !== month) { html += `<h3 class="month-label">${mLabel}</h3>`; month = mLabel; }
    const photos = (e.photos || []).map(p => {
      const idx = allPhotos.findIndex(x => x.entry === e && x.src === PHOTO_DIR + p);
      return `<button data-photo="${idx}" aria-label="查看大图"><img src="${esc(PHOTO_DIR + p)}" alt="${esc(e.date + ' ' + typeName(e))}" loading="lazy"></button>`;
    }).join('');
    html += `
      <article class="log" id="${e._id}" style="--c:${typeColor(e)}">
        <div class="log-date"><b>${d.getDate()}</b><small>周${WEEKDAY[d.getDay()]}</small></div>
        <div>
          <div class="log-meta">
            <span class="type">${esc(typeName(e))}</span>
            ${e.minutes ? `<span class="num-chip">${esc(e.minutes)} 分钟</span>` : ''}
            ${e.km ? `<span class="num-chip">${esc(e.km)} km</span>` : ''}
          </div>
          ${e.note ? `<p>${esc(e.note)}</p>` : ''}
          ${e.note_en ? `<p class="en" lang="en">${esc(e.note_en)}</p>` : ''}
          ${photos ? `<div class="photos">${photos}</div>` : ''}
        </div>
      </article>`;
  }
  feed.innerHTML = html;
  feed.querySelectorAll('[data-photo]').forEach(b => b.addEventListener('click', () => openLb(+b.dataset.photo)));
}

/* ---------- lightbox ---------- */
const lb = document.getElementById('lb');
let lbIndex = 0;
function openLb(i) {
  lbIndex = (i + allPhotos.length) % allPhotos.length;
  const p = allPhotos[lbIndex], d = parseDate(p.entry.date);
  document.getElementById('lb-img').src = p.src;
  document.getElementById('lb-img').alt = `${p.entry.date} ${typeName(p.entry)}`;
  document.getElementById('lb-cap').textContent = `${d.getMonth() + 1} 月 ${d.getDate()} 日，${typeName(p.entry)}（${lbIndex + 1}/${allPhotos.length}）`;
  if (!lb.open) lb.showModal();
}
document.getElementById('lb-prev').onclick = () => openLb(lbIndex - 1);
document.getElementById('lb-next').onclick = () => openLb(lbIndex + 1);
document.getElementById('lb-close').onclick = () => lb.close();
lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });
lb.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') openLb(lbIndex - 1);
  if (e.key === 'ArrowRight') openLb(lbIndex + 1);
});
</script>
</body>
</html>
