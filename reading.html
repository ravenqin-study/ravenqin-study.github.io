<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>读书笔记 | Raymond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  main { max-width: 980px; margin: 0 auto; padding: 3.5rem 1.5rem 0; }

  /* ===== hero: the shelf ===== */
  .hero h1 { font-family: var(--serif-zh); font-weight: 900; font-size: clamp(2.6rem, 7vw, 4.6rem); line-height: 1.1; }
  .hero .scribble { font-family: var(--hand); font-size: 1.6rem; color: var(--coral); transform: rotate(-2deg); display: inline-block; margin-top: .3rem; }
  .shelf-wrap { margin-top: 2.4rem; }
  .shelf { display: flex; align-items: flex-end; gap: 3px; height: 150px; padding: 0 10px; border-bottom: 10px solid var(--ink); overflow-x: auto; scrollbar-width: none; }
  .shelf::-webkit-scrollbar { display: none; }
  .spine { flex: 1 0 11px; min-width: 11px; border: 2px solid var(--ink); border-bottom: none; border-radius: 3px 3px 0 0; position: relative; background: var(--c); transition: transform .2s ease; }
  .spine::after { content: ''; position: absolute; left: 0; right: 0; top: 18%; height: 4px; background: rgba(26,26,46,.35); }
  .spine:hover, .spine:focus-visible { transform: translateY(-8px); }
  .spine.empty { background: transparent; border: none; height: 6px !important; }
  .spine.empty::after { top: auto; bottom: 0; height: 2px; background: rgba(26,26,46,.15); }
  .spine.empty:hover { transform: none; }
  .shelf-legend { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: .5rem; }
  .tip { position: fixed; pointer-events: none; z-index: 200; background: var(--ink); color: var(--cream); padding: .45rem .7rem; border-radius: 6px; font-size: .85rem; max-width: 240px; opacity: 0; transition: opacity .15s; }
  .stats { display: flex; flex-wrap: wrap; gap: 2.2rem; margin-top: 2rem; }
  .stat strong { font-family: var(--serif); font-size: 2rem; display: block; line-height: 1; }
  .stat span { color: var(--muted); font-size: .9rem; }
  .stat.streak strong { color: var(--coral); }

  /* ===== filters ===== */
  .filters { margin-top: 3.2rem; display: flex; flex-direction: column; gap: 1rem; }
  .search { width: 100%; font: inherit; font-size: 1.05rem; padding: .8rem 1rem; background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; box-shadow: 4px 4px 0 var(--ink); }

  /* ===== timeline ===== */
  .month { font-family: var(--hand); font-size: 1.9rem; color: var(--indigo); margin: 3rem 0 .6rem; }
  .entry { display: grid; grid-template-columns: 72px 1fr; gap: 1.2rem; padding: 1.3rem 0; border-top: 2px dashed rgba(26,26,46,.2); text-decoration: none; }
  .month + .entry { border-top: none; }
  .entry-date { text-align: center; }
  .entry-date b { font-family: var(--serif); font-size: 2.1rem; line-height: 1; display: block; }
  .entry-date small { color: var(--muted); font-size: .8rem; }
  .entry-book { font-size: .9rem; font-weight: 500; }
  .entry h2 { font-family: var(--serif-zh); font-size: 1.35rem; font-weight: 700; line-height: 1.4; margin: .2rem 0 .35rem; }
  .entry:hover h2 { text-decoration: underline; text-decoration-color: var(--saffron); text-decoration-thickness: 3px; text-underline-offset: 4px; }
  .entry p { color: var(--muted); max-width: 62ch; }
  .entry .tags { margin-top: .5rem; }
  #entries > .empty-state { margin-top: 3rem; }

  /* ===== single note ===== */
  .note-head { padding-bottom: 1.6rem; border-bottom: 2px solid var(--ink); }
  .back { font: inherit; background: none; border: none; cursor: pointer; font-weight: 500; border-bottom: 2px solid var(--saffron); margin-bottom: 2rem; }
  .note-book { display: inline-flex; align-items: center; gap: .6rem; padding: .35rem .9rem .35rem .4rem; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); font-weight: 500; }
  .note-book i { width: 1.1rem; height: 1.5rem; background: var(--c); border: 2px solid var(--ink); border-radius: 2px; }
  .note-head h1 { font-family: var(--serif-zh); font-weight: 900; font-size: clamp(1.9rem, 5vw, 2.9rem); line-height: 1.25; margin: 1rem 0 .6rem; }
  .note-meta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 1.2rem; margin-bottom: .6rem; }

  .prose { font-family: var(--serif-zh); font-size: 1.1rem; line-height: 1.95; max-width: 38em; margin-top: 2rem; }
  .prose > * + * { margin-top: 1.1em; }
  .prose h2, .prose h3 { font-family: var(--sans); font-weight: 700; margin-top: 2em; line-height: 1.4; }
  .prose h2 { font-size: 1.3rem; }
  .prose h3 { font-size: 1.1rem; }
  .prose ul, .prose ol { padding-left: 1.4em; }
  .prose li + li { margin-top: .35em; }
  .prose strong { background: linear-gradient(transparent 60%, rgba(244,162,54,.45) 60%); }
  .prose blockquote { position: relative; margin: 1.6em 0; padding: 1.1rem 1.4rem 1.1rem 1.6rem; background: var(--paper); border: 2px solid var(--ink); border-radius: 4px 14px 14px 4px; box-shadow: 5px 5px 0 var(--c, var(--mint)); }
  .prose blockquote::before { content: '“'; position: absolute; left: -.2rem; top: -1.6rem; font-family: var(--serif); font-size: 4rem; color: var(--coral); line-height: 1; }
  .prose code { font-size: .9em; background: rgba(26,26,46,.07); padding: .1em .35em; border-radius: 4px; }
  .prose img { border: 2px solid var(--ink); border-radius: 8px; }
  .prose hr { border: none; border-top: 2px dashed rgba(26,26,46,.25); }

  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 4rem; }
  .pager a { display: block; padding: 1rem 1.2rem; border: 2px solid var(--ink); border-radius: 10px; text-decoration: none; background: var(--paper); transition: box-shadow .15s, transform .15s; }
  .pager a:hover { box-shadow: 4px 4px 0 var(--ink); transform: translate(-2px, -2px); }
  .pager small { color: var(--muted); display: block; }
  .pager .next { text-align: right; grid-column: 2; }

  @media (max-width: 640px) {
    .entry { grid-template-columns: 52px 1fr; gap: .9rem; }
    .entry-date b { font-size: 1.7rem; }
    .pager { grid-template-columns: 1fr; }
    .pager .next { grid-column: 1; }
  }
</style>
</head>
<body>

<nav class="site-nav" aria-label="Main">
  <a class="nav-logo" href="index.html">Raymond</a>
  <ul class="nav-links">
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#research">Research</a></li>
    <li><a href="index.html#publications">Publications</a></li>
    <li><a href="index.html#cv">CV</a></li>
    <li><a href="index.html#notebook">Notebook</a></li>
    <li><a href="reading.html" aria-current="page">读书笔记</a></li>
  </ul>
</nav>

<main id="app" aria-live="polite"></main>
<div class="tip" id="tip" role="tooltip"></div>

<footer class="site-footer">
  <div class="wrap">
    <span class="sign">one page a day keeps the boredom away</span>
    <div class="links">
      <a href="mailto:you@example.com">Email</a>
      <a href="https://github.com/">GitHub</a>
      <a href="index.html">主页</a>
    </div>
  </div>
</footer>

<script src="assets/notes.js"></script>
<script>
const SHELF_DAYS = 70;
const app = document.getElementById('app');
const tip = document.getElementById('tip');
let notes = [];
let state = { query: '', book: null };

async function init() {
  try { notes = await loadNotes(); }
  catch { app.innerHTML = `<div class="empty-state">没能读取 <code>${NOTES_INDEX}</code>。<br>${LOCAL_FILE_HINT}/reading.html</div>`; return; }
  route();
}

/* ---------- list view ---------- */
function renderList() {
  const books = [...new Set(notes.map(n => n.book))];
  const byDay = {};
  notes.forEach(n => (byDay[n.date] ||= []).push(n));

  let spines = '';
  const today = new Date();
  for (let i = SHELF_DAYS - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    const key = ymd(d), list = byDay[key];
    if (list) {
      const n = list[0];
      const h = 58 + (strHash(n.id) % 38);
      const label = `${key}：《${n.book}》${n.title}` + (list.length > 1 ? ` 等 ${list.length} 篇` : '');
      spines += `<a class="spine" href="#/note/${encodeURIComponent(n.id)}" style="--c:${bookColor(n.book)};height:${h}%" data-tip="${esc(label)}" aria-label="${esc(label)}"></a>`;
    } else {
      spines += `<span class="spine empty" aria-hidden="true"></span>`;
    }
  }

  app.innerHTML = `
    <section class="hero">
      <h1>读书笔记</h1>
      <div class="scribble">每天读一点，写一点</div>
      <div class="shelf-wrap">
        <div class="shelf" id="shelf">${spines}</div>
        <div class="shelf-legend"><span>${SHELF_DAYS} 天前</span><span>今天</span></div>
      </div>
      <div class="stats">
        <div class="stat"><strong>${notes.length}</strong><span>篇笔记</span></div>
        <div class="stat"><strong>${books.length}</strong><span>本书</span></div>
        <div class="stat streak"><strong>${readingStreak(notes)}</strong><span>天连续记录</span></div>
      </div>
    </section>
    <section class="filters">
      <input class="search" id="search" type="search" placeholder="搜索书名、标题、标签…" value="${esc(state.query)}" aria-label="搜索笔记">
      <div class="chips" role="group" aria-label="按书筛选">
        <button class="chip" data-book="" aria-pressed="${!state.book}">全部</button>
        ${books.map(b => `<button class="chip" data-book="${esc(b)}" aria-pressed="${state.book === b}" style="--c:${bookColor(b)}"><span class="dot"></span>${esc(b)}</button>`).join('')}
      </div>
    </section>
    <section id="entries"></section>`;

  renderEntries();
  document.getElementById('search').addEventListener('input', e => { state.query = e.target.value; renderEntries(); });
  app.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => {
    state.book = btn.dataset.book || null;
    app.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', (c.dataset.book || null) === state.book));
    renderEntries();
  }));

  const shelf = document.getElementById('shelf');
  shelf.scrollLeft = shelf.scrollWidth;
  shelf.addEventListener('pointermove', e => {
    const s = e.target.closest('.spine:not(.empty)');
    if (!s) { tip.style.opacity = 0; return; }
    tip.textContent = s.dataset.tip;
    tip.style.left = Math.min(e.clientX + 12, innerWidth - 250) + 'px';
    tip.style.top = (e.clientY - 44) + 'px';
    tip.style.opacity = 1;
  });
  shelf.addEventListener('pointerleave', () => tip.style.opacity = 0);
}

function renderEntries() {
  const q = state.query.trim().toLowerCase();
  const list = notes.filter(n =>
    (!state.book || n.book === state.book) &&
    (!q || [n.title, n.book, n.author, n.excerpt, ...(n.tags || [])].join(' ').toLowerCase().includes(q)));
  const box = document.getElementById('entries');
  if (!list.length) {
    box.innerHTML = notes.length
      ? `<div class="empty-state">没有符合条件的笔记。换个关键词，或点“全部”查看所有笔记。</div>`
      : `<div class="empty-state">还没有笔记。运行 <code>python3 new_note.py</code> 写下第一篇。</div>`;
    return;
  }
  let html = '', month = '';
  for (const n of list) {
    const d = parseDate(n.date);
    const m = `${d.getFullYear()} 年 ${d.getMonth() + 1} 月`;
    if (m !== month) { html += `<h3 class="month">${m}</h3>`; month = m; }
    html += `
      <a class="entry" href="#/note/${encodeURIComponent(n.id)}" style="--c:${bookColor(n.book)}">
        <div class="entry-date"><b>${d.getDate()}</b><small>周${WEEKDAY[d.getDay()]}</small></div>
        <div>
          <div class="entry-book"><i class="book-mark"></i>《${esc(n.book)}》${n.progress ? ' ' + esc(n.progress) : ''}</div>
          <h2>${esc(n.title)}</h2>
          ${n.excerpt ? `<p>${esc(n.excerpt)}</p>` : ''}
          ${n.tags?.length ? `<div class="tags">${n.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
        </div>
      </a>`;
  }
  box.innerHTML = html;
}

/* ---------- single note ---------- */
async function renderNote(id) {
  const i = notes.findIndex(n => n.id === id);
  if (i < 0) { app.innerHTML = `<div class="empty-state">找不到这篇笔记。<a href="#/">回到笔记列表</a></div>`; return; }
  const n = notes[i], newer = notes[i - 1], older = notes[i + 1];
  const d = parseDate(n.date);
  app.innerHTML = `
    <article style="--c:${bookColor(n.book)}">
      <button class="back" onclick="location.hash='#/'">返回全部笔记</button>
      <header class="note-head">
        <span class="note-book"><i></i>《${esc(n.book)}》${esc(n.author || '')}</span>
        <h1>${esc(n.title)}</h1>
        <div class="note-meta">
          <span>${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日，周${WEEKDAY[d.getDay()]}</span>
          ${n.progress ? `<span>读到：${esc(n.progress)}</span>` : ''}
        </div>
        ${n.tags?.length ? `<div class="tags">${n.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      </header>
      <div class="prose" id="prose">正在加载…</div>
      <div class="pager">
        ${older ? `<a class="prev" href="#/note/${encodeURIComponent(older.id)}"><small>上一篇</small>${esc(older.title)}</a>` : '<span></span>'}
        ${newer ? `<a class="next" href="#/note/${encodeURIComponent(newer.id)}"><small>下一篇</small>${esc(newer.title)}</a>` : ''}
      </div>
    </article>`;
  document.title = `${n.title} | 读书笔记`;
  scrollTo(0, 0);
  try {
    const res = await fetch(NOTES_DIR + encodeURIComponent(n.id) + '.md', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    document.getElementById('prose').innerHTML = marked.parse(await res.text());
  } catch {
    document.getElementById('prose').innerHTML = `<p>没能读取 <code>${NOTES_DIR}${esc(n.id)}.md</code>，请检查文件名是否和 notes.json 里的 id 一致。</p>`;
  }
}

function route() {
  const m = location.hash.match(/^#\/note\/(.+)$/);
  if (m) renderNote(decodeURIComponent(m[1]));
  else { document.title = '读书笔记 | Raymond'; renderList(); }
}
addEventListener('hashchange', route);
init();
</script>
</body>
</html>
